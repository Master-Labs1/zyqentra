<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="Workflow: create inbox, use address in your sign-up form, poll messages, read OTP">
<rect width="960" height="200" rx="16" fill="#0f1115"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c6f432"/></marker></defs>
<g font-family="Geist, Inter, Arial, sans-serif" fill="#f4f5f7">
<g><rect x="24" y="50" width="195" height="100" rx="12" fill="#15171c" stroke="#2a2d35"/><text x="42" y="88" font-size="13" fill="#c6f432" font-family="Menlo, monospace">POST /inboxes</text><text x="42" y="116" font-size="16">1. Create inbox</text><text x="42" y="136" font-size="12" fill="#9ca3af">1 or 3 credits · 10 min</text></g>
<g><rect x="258" y="50" width="195" height="100" rx="12" fill="#15171c" stroke="#2a2d35"/><text x="276" y="88" font-size="13" fill="#c6f432" font-family="Menlo, monospace">your app</text><text x="276" y="116" font-size="16">2. Use the address</text><text x="276" y="136" font-size="12" fill="#9ca3af">accounts you own</text></g>
<g><rect x="492" y="50" width="195" height="100" rx="12" fill="#15171c" stroke="#2a2d35"/><text x="510" y="88" font-size="11" fill="#c6f432" font-family="Menlo, monospace">GET /inboxes/{id}/messages</text><text x="510" y="116" font-size="16">3. Poll</text><text x="510" y="136" font-size="12" fill="#9ca3af">3 credits per poll</text></g>
<g><rect x="726" y="50" width="210" height="100" rx="12" fill="#15171c" stroke="#2a2d35"/><text x="744" y="88" font-size="13" fill="#c6f432" font-family="Menlo, monospace">message.otp</text><text x="744" y="116" font-size="16">4. Read the code</text><text x="744" y="136" font-size="12" fill="#9ca3af">or GET /messages/{id}</text></g>
<path d="M221 100h30M455 100h30M689 100h30" stroke="#c6f432" stroke-width="2" marker-end="url(#a)"/></g>
</svg>
