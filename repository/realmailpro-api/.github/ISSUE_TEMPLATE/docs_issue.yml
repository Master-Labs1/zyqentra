name: Documentation correction
description: Report a docs page or OpenAPI field that disagrees with RealMailPro's published documentation.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: docs/api-reference.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source
      description: Link to the RealMailPro page that shows the correct behaviour.
